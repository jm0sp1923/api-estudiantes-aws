<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#37474F"/>
    </marker>
    <marker id="fv" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#2E7D5B"/>
    </marker>
    <marker id="fa" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#1B6CA8"/>
    </marker>
  </defs>

  <rect width="1280" height="740" fill="#FFFFFF"/>

  <text x="640" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#232F3E">
    Pipeline de despliegue automatico con AWS CodePipeline
  </text>
  <text x="640" y="63" text-anchor="middle" font-size="13.5" fill="#546E7A">
    Taller de despliegues automaticos &#8212; Herramientas de Software II &#8212; Universidad de La Salle
  </text>

  <!-- Desarrollador -->
  <rect x="24" y="150" width="170" height="130" rx="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="2"/>
  <text x="109" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#232F3E">Desarrollador</text>
  <line x1="42" y1="192" x2="176" y2="192" stroke="#B0BEC5"/>
  <text x="42" y="216" font-size="12" fill="#37474F">git commit</text>
  <text x="42" y="238" font-size="12" fill="#37474F">git push origin main</text>
  <text x="42" y="264" font-size="11" fill="#78909C">Mac local</text>

  <line x1="196" y1="215" x2="268" y2="215" stroke="#37474F" stroke-width="2.5" marker-end="url(#f)"/>

  <!-- GitHub -->
  <rect x="270" y="150" width="160" height="130" rx="10" fill="#F4F2F8" stroke="#4A2F73" stroke-width="2"/>
  <rect x="270" y="150" width="160" height="34" rx="10" fill="#4A2F73"/>
  <text x="350" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">GitHub</text>
  <text x="350" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A2F73">api-estudiantes</text>
  <text x="350" y="228" text-anchor="middle" font-size="11.5" fill="#546E7A">rama main</text>
  <text x="350" y="256" text-anchor="middle" font-size="11" fill="#78909C">Repositorio de codigo</text>

  <!-- Nube AWS -->
  <rect x="460" y="96" width="800" height="560" rx="14" fill="#FAFBFC" stroke="#B0BEC5" stroke-dasharray="7 5"/>
  <text x="482" y="122" font-size="13.5" font-weight="bold" fill="#78909C">Nube de AWS &#8212; region us-east-1</text>

  <!-- Conexion -->
  <line x1="432" y1="215" x2="496" y2="215" stroke="#37474F" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="464" y="204" text-anchor="middle" font-size="10" fill="#1B6CA8">webhook</text>

  <!-- CodePipeline marco -->
  <rect x="498" y="146" width="500" height="296" rx="10" fill="#FFF7EC" stroke="#FF9900" stroke-width="2.5"/>
  <rect x="498" y="146" width="500" height="36" rx="10" fill="#FF9900"/>
  <text x="748" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">AWS CodePipeline</text>

  <!-- Etapa 1 -->
  <rect x="516" y="198" width="146" height="112" rx="8" fill="#FFFFFF" stroke="#E0B060"/>
  <text x="589" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232F3E">1. Fuente</text>
  <line x1="530" y1="232" x2="648" y2="232" stroke="#EADFC8"/>
  <text x="530" y="252" font-size="10.5" fill="#546E7A">CodeConnections</text>
  <text x="530" y="270" font-size="10.5" fill="#546E7A">Descarga el commit</text>
  <text x="530" y="288" font-size="10.5" fill="#546E7A">Artefacto: fuente</text>
  <text x="530" y="304" font-size="10" fill="#8D6E00">~10 s</text>

  <!-- Etapa 2 -->
  <rect x="674" y="198" width="146" height="112" rx="8" fill="#FFFFFF" stroke="#E0B060"/>
  <text x="747" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232F3E">2. Construccion</text>
  <line x1="688" y1="232" x2="806" y2="232" stroke="#EADFC8"/>
  <text x="688" y="252" font-size="10.5" fill="#546E7A">CodeBuild</text>
  <text x="688" y="270" font-size="10.5" fill="#546E7A">npm ci + tsc</text>
  <text x="688" y="288" font-size="10.5" fill="#546E7A">docker build/push</text>
  <text x="688" y="304" font-size="10" fill="#8D6E00">~2 min</text>

  <!-- Etapa 3 -->
  <rect x="832" y="198" width="146" height="112" rx="8" fill="#FFFFFF" stroke="#E0B060"/>
  <text x="905" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232F3E">3. Despliegue</text>
  <line x1="846" y1="232" x2="964" y2="232" stroke="#EADFC8"/>
  <text x="846" y="252" font-size="10.5" fill="#546E7A">Accion ECS</text>
  <text x="846" y="270" font-size="10.5" fill="#546E7A">Nueva revision</text>
  <text x="846" y="288" font-size="10.5" fill="#546E7A">Rolling update</text>
  <text x="846" y="304" font-size="10" fill="#8D6E00">~2 min</text>

  <line x1="664" y1="254" x2="672" y2="254" stroke="#37474F" stroke-width="2" marker-end="url(#f)"/>
  <line x1="822" y1="254" x2="830" y2="254" stroke="#37474F" stroke-width="2" marker-end="url(#f)"/>

  <!-- Artefactos -->
  <rect x="516" y="330" width="462" height="42" rx="6" fill="#EEF3FA" stroke="#1B6CA8"/>
  <text x="747" y="347" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D3C61">Bucket de artefactos en S3 (versionado)</text>
  <text x="747" y="364" text-anchor="middle" font-size="10" fill="#546E7A">CodigoFuente &#8594; DefinicionImagen (imagedefinitions.json)</text>

  <rect x="516" y="386" width="462" height="40" rx="6" fill="#F3EEF9" stroke="#6A4C93"/>
  <text x="747" y="403" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A2F73">CloudWatch Logs</text>
  <text x="747" y="419" text-anchor="middle" font-size="10" fill="#546E7A">/aws/codebuild/construccion-api-estudiantes &#183; /ecs/api-estudiantes</text>

  <!-- ECR -->
  <rect x="1016" y="198" width="226" height="112" rx="10" fill="#EAF5EE" stroke="#2E7D5B" stroke-width="2"/>
  <text x="1129" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B5E3F">Amazon ECR</text>
  <line x1="1032" y1="232" x2="1226" y2="232" stroke="#CBE3D5"/>
  <text x="1032" y="252" font-size="10.5" fill="#37474F">api-estudiantes:a3f91c2</text>
  <text x="1032" y="270" font-size="10.5" fill="#37474F">api-estudiantes:latest</text>
  <text x="1032" y="292" font-size="10" fill="#78909C">Etiqueta = SHA del commit</text>
  <line x1="980" y1="240" x2="1012" y2="240" stroke="#2E7D5B" stroke-width="2" marker-end="url(#fv)"/>
  <text x="996" y="232" text-anchor="middle" font-size="9.5" fill="#2E7D5B">push</text>

  <!-- ECS -->
  <rect x="640" y="474" width="360" height="146" rx="10" fill="#EAF5EE" stroke="#2E7D5B" stroke-width="2.5"/>
  <rect x="640" y="474" width="360" height="34" rx="10" fill="#2E7D5B"/>
  <text x="820" y="497" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Amazon ECS &#183; AWS Fargate</text>
  <text x="820" y="528" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1B5E3F">cluster-estudiantes / servicio-api-estudiantes</text>
  <rect x="660" y="540" width="320" height="64" rx="6" fill="#FFFFFF" stroke="#A5CDB6"/>
  <text x="674" y="560" font-size="10.5" fill="#37474F">Tarea anterior: se drena y se detiene</text>
  <text x="674" y="578" font-size="10.5" fill="#37474F">Tarea nueva: imagen a3f91c2, con health check</text>
  <text x="674" y="596" font-size="10.5" fill="#37474F">Sin interrupcion del servicio</text>
  <path d="M905 314 L905 322 L988 322 L988 470" fill="none" stroke="#37474F" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="1000" y="400" font-size="10.5" fill="#37474F">UpdateService</text>

  <!-- IAM -->
  <rect x="1016" y="474" width="226" height="146" rx="10" fill="#EEF3FA" stroke="#1B6CA8" stroke-width="2"/>
  <text x="1129" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D3C61">AWS IAM</text>
  <line x1="1032" y1="508" x2="1226" y2="508" stroke="#D3E0EE"/>
  <text x="1032" y="528" font-size="10" fill="#37474F">rol-codepipeline-api-</text>
  <text x="1032" y="543" font-size="10" fill="#37474F">estudiantes</text>
  <text x="1032" y="566" font-size="10" fill="#37474F">rol-codebuild-api-</text>
  <text x="1032" y="581" font-size="10" fill="#37474F">estudiantes</text>
  <text x="1032" y="604" font-size="10" fill="#37474F">ecsTaskExecutionRole</text>
  <path d="M1000 540 L1012 540" fill="none" stroke="#1B6CA8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#fa)"/>

  <!-- Usuario final -->
  <rect x="470" y="474" width="146" height="146" rx="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="2"/>
  <text x="543" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Cliente</text>
  <line x1="486" y1="510" x2="600" y2="510" stroke="#B0BEC5"/>
  <text x="486" y="532" font-size="10.5" fill="#37474F">curl / Postman</text>
  <text x="486" y="554" font-size="10.5" fill="#37474F">GET /students</text>
  <text x="486" y="578" font-size="10" fill="#546E7A">IP publica</text>
  <text x="486" y="594" font-size="10" fill="#546E7A">puerto 3000</text>
  <line x1="636" y1="547" x2="618" y2="547" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#fv)"/>

  <text x="640" y="690" text-anchor="middle" font-size="11.5" fill="#78909C">
    Un push a la rama main dispara las tres etapas sin intervencion manual: el codigo llega a produccion en unos cuatro minutos.
  </text>
</svg>
